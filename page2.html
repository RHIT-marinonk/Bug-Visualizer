<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page 2</title>
</head>

<body>

  <h1>Page 2</h1>

  <label>
    <input type="checkbox" id="box2">
    Checkbox 2
  </label>

  <br><br>

  <a href="page1.html">Back to Page 1</a>

  <script>
    const box2 = document.getElementById("box2");

    // Mark that Page 2 has been entered
    localStorage.setItem("visitedPage2", "true");

    // Start with the state from Page 1
    box2.checked = localStorage.getItem("checkboxState") === "true";

    // Continuously toggle Page 2's checkbox
    setInterval(function () {
      box2.checked = !box2.checked;
    }, 250);
  </script>

</body>
</html>
