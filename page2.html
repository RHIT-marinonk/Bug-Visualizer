<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page 2</title>
</head>

<body>

  <h1>Page 2</h1>

  <label>
    <input type="checkbox" id="box2">
    Checkbox 2
  </label>

  <br><br>

  <a href="page1.html">Back to Page 1</a>

  <script>
    const box2 = document.getElementById("box2");

    const checkboxState =
      localStorage.getItem("checkboxState") === "true";

    // Start with the same state as Page 1
    box2.checked = checkboxState;

    // ONLY start flickering if checkboxState is true
    if (checkboxState) {
      localStorage.setItem("visitedPage2", "true");
      flickerInterval = setInterval(function () {
        box2.checked = !box2.checked;
      }, 250);
    }
  </script>

</body>
</html>
