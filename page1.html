<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page 1</title>
</head>

<body>

  <h1>Page 1</h1>

  <label>
    <input type="checkbox" id="box1">
    Checkbox 1
  </label>

  <br><br>

  <a href="page2.html">Go to Page 2</a>

  <br><br>

  <button id="resetButton">Reset Flickering</button>

  <script>
    const box1 = document.getElementById("box1");
    const resetButton = document.getElementById("resetButton");

    let flickerInterval = null;

    // Restore the saved checkbox state
    box1.checked = localStorage.getItem("checkboxState") === "true";

    // Check if Page 2 has been visited
    const visitedPage2 =
      localStorage.getItem("visitedPage2") === "true";

    // Start flickering if Page 2 has been visited
    if (visitedPage2) {
      flickerInterval = setInterval(function () {
        box1.checked = !box1.checked;
      }, 250);
    }

    // Save manually changed checkbox state
    box1.addEventListener("change", function () {
      localStorage.setItem("checkboxState", box1.checked);
    });

    // Reset everything
    resetButton.addEventListener("click", function () {

      // Stop the flickering
      if (flickerInterval !== null) {
        clearInterval(flickerInterval);
        flickerInterval = null;
      }

      // Clear saved data
      localStorage.removeItem("visitedPage2");
      localStorage.removeItem("checkboxState");

      // Uncheck the box
      box1.checked = false;
    });
  </script>

</body>
</html>
