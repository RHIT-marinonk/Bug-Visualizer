<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page 1</title>
</head>

<body>

  <h1>Page 1</h1>

  <label>
    <input type="checkbox" id="box1">
    Checkbox 1
  </label>

  <br><br>

  <a href="page2.html">Go to Page 2</a>

  <script>
    const box1 = document.getElementById("box1");

    box1.checked = localStorage.getItem("checkboxState") === "true";

    const visitedPage2 = localStorage.getItem("visitedPage2") === "true";

    if (visitedPage2) {
      setInterval(function () {
        box1.checked = !box1.checked;
      }, 250);
    }

    box1.addEventListener("change", function () {
      localStorage.setItem("checkboxState", box1.checked);
    });
  </script>

</body>
</html>
